<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b09">
  <title>Swock | App Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080b09;
      --surface: #101512;
      --surface-2: #171d19;
      --raised: #1a201c;
      --ink: #e2e8e4;
      --muted: #a7b0aa;
      --faint: #77817a;
      --line: #39413b;
      --green: #55e89a;
      --cyan: #5fe5e4;
      --yellow: #ffd45c;
      --red: #ff625c;
      font-family: Roboto, "Noto Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #111613; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(circle at top, rgba(85, 232, 154, 0.08), transparent 18%),
        #111613;
    }

    button, input, select, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }

    .device {
      position: relative;
      width: min(100vw, 430px);
      height: min(100dvh, 900px);
      min-height: 620px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--bg);
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
    }

    .status-bar {
      height: 28px;
      flex: 0 0 28px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #dbe3de;
      font-size: 13px;
      font-weight: 600;
      background: var(--bg);
    }

    .sys-icons {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .signal {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 13px;
    }
    .signal i {
      display: block;
      width: 3px;
      background: #dbe3de;
      border-radius: 1px;
    }
    .signal i:nth-child(1) { height: 5px; opacity: .65; }
    .signal i:nth-child(2) { height: 8px; opacity: .8; }
    .signal i:nth-child(3) { height: 11px; }

    .wifi {
      width: 15px;
      height: 11px;
      border-top: 2px solid #dbe3de;
      border-radius: 50%;
      position: relative;
      display: inline-block;
    }
    .wifi::before {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 9px;
      height: 7px;
      border-top: 2px solid #dbe3de;
      border-radius: 50%;
    }
    .wifi::after {
      content: "";
      position: absolute;
      left: 6px;
      top: 8px;
      width: 3px;
      height: 3px;
      background: #dbe3de;
      border-radius: 50%;
    }

    .battery {
      width: 21px;
      height: 10px;
      padding: 1px;
      border: 1px solid #dbe3de;
      border-radius: 2px;
      position: relative;
      display: inline-block;
    }
    .battery::before {
      content: "";
      display: block;
      width: 72%;
      height: 100%;
      background: var(--yellow);
      border-radius: 1px;
    }
    .battery::after {
      content: "";
      position: absolute;
      top: 2px;
      right: -3px;
      width: 2px;
      height: 4px;
      background: #dbe3de;
    }

    .appbar {
      height: 72px;
      flex: 0 0 72px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 44px 1fr 52px;
      align-items: center;
      background: var(--bg);
    }

    .brand {
      text-align: center;
      line-height: 1.1;
    }
    .brand-name {
      color: var(--green);
      font: 600 16px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 4px;
    }
    .brand-by {
      margin-top: 4px;
      color: var(--muted);
      font: 9px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.1px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      font-size: 22px;
      border-radius: 50%;
    }

    main {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      scrollbar-color: #3d4a43 transparent;
      scrollbar-width: thin;
    }

    .page {
      padding: 10px 20px 18px;
      min-height: 100%;
    }

    .home-page {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .power-wrap {
      min-height: 180px;
      display: grid;
      place-items: center;
    }

    .power-button {
      width: 144px;
      height: 144px;
      border: 1.5px solid var(--line);
      border-radius: 50%;
      background: var(--surface);
      color: var(--faint);
      display: grid;
      place-items: center;
      font-size: 56px;
      line-height: 1;
      transition: all 0.18s ease;
    }
    .power-button.connected {
      border-color: var(--green);
      color: var(--green);
      box-shadow: inset 0 0 0 12px rgba(85, 232, 154, 0.03);
    }

    .status-card,
    .active-card,
    .profile,
    .dialog,
    .empty,
    .group {
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .status-card {
      min-height: 88px;
      padding: 14px 16px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .cloud-icon {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #171d19;
      color: var(--faint);
      font-size: 26px;
      flex: 0 0 52px;
    }

    .status-title {
      color: var(--muted);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.5px;
    }
    .status-copy {
      margin-top: 6px;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.42;
    }

    .active-card {
      padding: 16px 14px 12px;
      border-radius: 7px;
    }
    .eyebrow {
      color: var(--muted);
      font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.8px;
    }

    .active-main {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      min-height: 52px;
    }
    .file-icon { color: var(--green); font-size: 30px; }
    .active-detail { flex: 1; min-width: 0; }
    .active-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 15px;
      font-weight: 500;
    }
    .server-line {
      margin-top: 4px;
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .transport {
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      margin-left: auto;
    }

    .pingline {
      margin-top: 12px;
      color: var(--green);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .pingvalue {
      color: var(--yellow);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .ping-button {
      background: transparent;
      border: 0;
      color: var(--green);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      padding: 0;
    }

    .traffic {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      text-align: center;
    }
    .traffic-label {
      color: var(--muted);
      font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.4px;
    }
    .traffic-value {
      margin-top: 8px;
      color: var(--faint);
      font-size: 18px;
    }

    .configs-page {
      padding: 12px 16px 96px;
    }

    .group {
      min-height: 44px;
      padding: 0 12px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--raised);
      margin: 8px 0;
    }
    .group-label { font-size: 14px; }
    .group-count {
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .profile {
      min-height: 70px;
      margin-bottom: 8px;
      border-radius: 5px;
      padding: 8px 8px 8px 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      background: var(--surface);
    }
    .profile.selected {
      border-color: var(--green);
      background: rgba(85, 232, 154, 0.07);
      box-shadow: inset 0 0 0 1px rgba(85, 232, 154, 0.15);
    }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      font-weight: 500;
    }
    .profile-address {
      margin-top: 5px;
      color: var(--muted);
      font: 11px ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .profile-meta {
      width: 58px;
      flex: 0 0 58px;
      text-align: right;
      color: var(--muted);
      font: 10px ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .profile-ping {
      margin-top: 4px;
      color: var(--yellow);
    }
    .profile-action {
      width: 34px;
      height: 40px;
      flex: 0 0 34px;
      border: 0;
      background: transparent;
      color: #dfe8dd;
      display: grid;
      place-items: center;
      font-size: 18px;
    }

    .empty {
      min-height: 100%;
      display: grid;
      place-content: center;
      justify-items: center;
      padding: 28px 18px;
      border-radius: 8px;
      text-align: center;
    }
    .empty-icon { color: var(--faint); font-size: 52px; }
    .empty-title {
      margin-top: 18px;
      color: var(--muted);
      font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 1.5px;
    }
    .empty-copy {
      margin-top: 12px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .bottom-tabs {
      height: 80px;
      flex: 0 0 80px;
      display: flex;
      border-top: 1px solid #1d2520;
      background: var(--surface);
    }
    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .tab-icon {
      width: 56px;
      height: 32px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 22px;
    }
    .tab.active { color: var(--cyan); }
    .tab.active .tab-icon {
      background: rgba(95, 229, 228, 0.12);
    }
    .tab-label {
      font-size: 10px;
      letter-spacing: 1.2px;
    }

    .nav-bar {
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      background: var(--surface);
    }
    .nav-pill {
      width: 108px;
      height: 4px;
      border-radius: 4px;
      background: #e6ebe8;
    }

    .app-fab {
      position: absolute;
      right: max(20px, calc((100vw - 430px) / 2 + 20px));
      bottom: 114px;
      width: 58px;
      height: 58px;
      border: 0;
      border-radius: 50%;
      background: var(--green);
      color: #07120b;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.48);
      font-size: 32px;
      line-height: 1;
      z-index: 2;
    }

    .add-sheet {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 118px;
      z-index: 3;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.38);
    }
    .add-sheet button {
      width: 100%;
      min-height: 54px;
      border: 0;
      background: transparent;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      padding: 0 18px;
      font-size: 15px;
    }
    .add-sheet button span:first-child {
      color: var(--green);
      font-size: 22px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translate(-50%, 8px);
      opacity: 0;
      pointer-events: none;
      transition: 0.18s ease;
      width: max-content;
      max-width: calc(100vw - 30px);
      padding: 12px 16px;
      border: 1px solid rgba(124, 136, 128, 0.6);
      background: rgba(32, 39, 34, 0.95);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.4;
      z-index: 8;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .backdrop {
      position: fixed;
      inset: 0;
      z-index: 9;
      display: none;
      place-items: center;
      background: rgba(0, 0, 0, 0.55);
      padding: 18px;
    }
    .backdrop.open { display: grid; }

    .dialog {
      width: min(420px, 100%);
      max-height: min(88dvh, 760px);
      overflow: auto;
      border-radius: 10px;
      background: #151a16;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.45);
      padding: 20px 18px 16px;
    }
    .dialog-title {
      margin: 0 0 18px;
      font-size: 19px;
      font-weight: 600;
    }
    .form-field { margin-bottom: 14px; }
    .form-field label {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 12px;
    }
    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      min-height: 46px;
      border: 1px solid var(--line);
      background: #0a0e0b;
      color: var(--ink);
      padding: 10px 12px;
      outline: 0;
    }
    .form-field textarea { min-height: 72px; resize: vertical; }
    .form-field input:focus,
    .form-field select:focus,
    .form-field textarea:focus {
      border-color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(85, 232, 154, 0.2);
    }
    .switch-row {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--ink);
    }
    .switch-row input {
      width: 42px;
      height: 24px;
      accent-color: var(--green);
    }
    .form-note {
      color: var(--faint);
      font-size: 11px;
      line-height: 1.5;
      margin: 10px 0 16px;
    }
    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }
    .dialog-actions button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }
    .dialog-actions .primary {
      border-color: var(--green);
      background: var(--green);
      color: #07120b;
      font-weight: 600;
    }

    .preview-note {
      color: var(--faint);
      padding: 8px 12px 0;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (min-width: 600px) {
      .device {
        height: min(860px, calc(100dvh - 46px));
        min-height: 0;
        border: 1px solid #303a35;
        border-radius: 18px;
      }
      .status-bar { padding-inline: 24px; }
      .nav-bar { height: 26px; }
    }

    @media (max-height: 720px) {
      .power-wrap { min-height: 150px; }
      .power-button { width: 120px; height: 120px; }
      .page { padding-top: 6px; }
    }
  </style>
</head>
<body>
  <section class="device" aria-label="Swock app preview">
    <div class="status-bar">
      <span>7:20</span>
      <span class="sys-icons">
        <span class="signal"><i></i><i></i><i></i></span>
        <span class="wifi" aria-hidden="true"></span>
        <span class="battery" aria-hidden="true"></span>
      </span>
    </div>

    <header class="appbar">
      <span></span>
      <div class="brand">
        <div class="brand-name">SWOCK</div>
        <div class="brand-by">Developed By: Verdantix Digital</div>
      </div>
      <button class="icon-button" id="favorite-active" type="button" aria-label="Favorite active profile">☆</button>
    </header>

    <main id="screen-content"></main>

    <nav class="bottom-tabs" aria-label="Main navigation">
      <button class="tab active" data-tab="0" type="button">
        <span class="tab-icon">⌂</span>
        <span class="tab-label">HOME</span>
      </button>
      <button class="tab" data-tab="1" type="button">
        <span class="tab-icon">☁</span>
        <span class="tab-label">CONFIGS</span>
      </button>
      <button class="tab" data-tab="2" type="button">
        <span class="tab-icon">▣</span>
        <span class="tab-label">STATS</span>
      </button>
      <button class="tab" data-tab="3" type="button">
        <span class="tab-icon">ℹ</span>
        <span class="tab-label">INFO</span>
      </button>
      <button class="tab" data-tab="4" type="button">
        <span class="tab-icon">ⓘ</span>
        <span class="tab-label">LOGS</span>
      </button>
    </nav>

    <div class="nav-bar" aria-hidden="true"><span class="nav-pill"></span></div>
  </section>

  <div class="preview-note">Preview only · sample profiles</div>

  <button class="app-fab" id="add-fab" aria-label="Add profile" type="button" hidden>＋</button>

  <div class="add-sheet" id="add-sheet" hidden>
    <button type="button" id="manual-option"><span>✎</span><span>Add manually</span></button>
    <button type="button" id="import-option"><span>↗</span><span>Import via URI</span></button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="backdrop" id="profile-dialog" role="presentation">
    <form class="dialog" id="profile-form">
      <h2 class="dialog-title" id="form-title">Add configuration</h2>

      <div class="form-field"><label for="profile-name">Remarks / profile name</label><input id="profile-name" autocomplete="off"></div>
      <div class="form-field"><label for="profile-server">Address / server host</label><input id="profile-server" autocomplete="off"></div>
      <div class="form-field"><label for="profile-port">Port</label><input id="profile-port" type="number" min="1" max="65535" value="443"></div>
      <div class="form-field"><label for="profile-transport">Transport</label><select id="profile-transport"><option value="auto">Auto</option><option value="tcp">TCP</option></select></div>

      <div class="switch-row"><label for="websocket-enabled">WebSocket</label><input id="websocket-enabled" type="checkbox"></div>
      <div class="form-field" id="websocket-host-wrap" hidden><label for="websocket-host">WebSocket host</label><input id="websocket-host"></div>
      <div class="form-field" id="websocket-path-wrap" hidden><label for="websocket-path">WebSocket path</label><input id="websocket-path" value="/"></div>

      <div class="switch-row"><label for="tls-enabled">TLS</label><input id="tls-enabled" type="checkbox"></div>
      <div class="form-field" id="tls-sni-wrap" hidden><label for="tls-sni">TLS SNI</label><input id="tls-sni"></div>

      <div class="form-field"><label for="profile-public">Server public key (X25519 hex)</label><input id="profile-public" autocomplete="off"></div>
      <div class="form-field"><label for="profile-private">Client private key (X25519 hex)</label><input id="profile-private" type="password" autocomplete="new-password"></div>
      <div class="form-field"><label for="profile-notes">Notes (optional)</label><textarea id="profile-notes"></textarea></div>

      <p class="form-note">WebSocket and TLS can be enabled independently or together. The server must match the configured transport layer.</p>

      <div class="dialog-actions">
        <button type="button" id="cancel-profile">Cancel</button>
        <button class="primary" type="submit">Save</button>
      </div>
    </form>
  </div>

  <div class="backdrop" id="import-dialog" role="presentation">
    <section class="dialog" aria-modal="true">
      <h2 class="dialog-title">Import Swock profile</h2>
      <div class="form-field"><label for="profile-uri">Swock profile link</label><textarea id="profile-uri" placeholder="swock://server?port=443&spk=...&cpk=..."></textarea></div>
      <p class="form-note">The share link includes the client private key. Keep it private.</p>
      <div class="dialog-actions">
        <button type="button" id="cancel-import">Cancel</button>
        <button class="primary" type="button" id="confirm-import">Import</button>
      </div>
    </section>
  </div>

  <script>
    const sampleProfiles = [
      { id: 'alpha', name: 'Swock Primary', server: 'swock-us-01', port: 443, transport: 'tcp', publicKey: 'a'.repeat(64), privateKey: 'b'.repeat(64), favorite: false, selected: true, notes: '', websocket: false, tls: false },
      { id: 'beta', name: 'Swock Backup', server: 'swock-eu-02', port: 443, transport: 'auto', publicKey: 'c'.repeat(64), privateKey: 'd'.repeat(64), favorite: false, selected: false, notes: '', websocket: false, tls: false },
      { id: 'gamma', name: 'Swock Edge', server: 'swock-fr-03', port: 8443, transport: 'auto', publicKey: 'e'.repeat(64), privateKey: 'f'.repeat(64), favorite: true, selected: false, notes: '', websocket: true, tls: true }
    ];

    const appContent = document.querySelector('#screen-content');
    const toast = document.querySelector('#toast');
    const profileDialog = document.querySelector('#profile-dialog');
    const importDialog = document.querySelector('#import-dialog');
    const addSheet = document.querySelector('#add-sheet');
    const addFab = document.querySelector('#add-fab');

    let tab = 0;
    let connected = false;
    let logEntries = [];
    let profiles = JSON.parse(localStorage.getItem('swock-preview-profiles') || 'null') || sampleProfiles;
    let editingId = null;
    let toastTimer;

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
    const activeProfile = () => profiles.find((profile) => profile.selected) || profiles[0] || null;
    const saveProfiles = () => localStorage.setItem('swock-preview-profiles', JSON.stringify(profiles));

    function notify(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function selectedTransport(profile) {
      if (profile.websocket && profile.tls) return 'ws+tls';
      if (profile.websocket) return 'ws';
      if (profile.tls) return 'tls';
      return profile.transport === 'auto' ? 'auto' : 'tcp';
    }

    function renderHome() {
      const profile = activeProfile();
      const statusLabel = connected ? 'CONNECTED' : 'DISCONNECTED';
      const helperText = connected
        ? 'Secure tunnel is active and traffic is being routed.'
        : profile
        ? 'Choose a configuration, then tap the power button to connect.'
        : 'Add a configuration, then tap the power button to connect.';

      appContent.innerHTML = `
        <section class="page home-page">
          <div class="power-wrap">
            <button class="power-button ${connected ? 'connected' : ''}" id="connect-toggle" type="button" aria-label="Toggle tunnel">⏻</button>
          </div>

          <div class="status-card">
            <div class="cloud-icon">${connected ? '☁' : '☁̸'}</div>
            <div>
              <div class="status-title">${statusLabel}</div>
              <div class="status-copy">${helperText}</div>
            </div>
          </div>

          ${profile ? `
            <article class="active-card">
              <div class="eyebrow">ACTIVE CONFIGURATION</div>
              <div class="active-main">
                <span class="file-icon">▣</span>
                <div class="active-detail">
                  <div class="active-name">${escapeHtml(profile.name)}</div>
                  <div class="server-line">${escapeHtml(profile.server)}:${escapeHtml(profile.port)}</div>
                </div>
                <span class="transport">${selectedTransport(profile)}</span>
                <span class="chevron">›</span>
              </div>
            </article>
          ` : `
            <article class="active-card">
              <div class="eyebrow">ACTIVE CONFIGURATION</div>
              <div style="margin-top: 12px; font-size: 15px;">No profile selected.</div>
              <div style="margin-top: 8px; color: var(--muted); font-size: 12px;">Add a Swock profile to get started in Configs.</div>
            </article>
          `}
        </section>
      `;

      document.querySelector('#connect-toggle').addEventListener('click', () => {
        if (!profile) {
          tab = 1;
          render();
          notify('Add a profile before connecting.');
          return;
        }
        connected = !connected;
        notify(connected ? `Preview: connected to ${profile.name}` : 'Preview: tunnel disconnected');
        render();
      });

      document.querySelector('#ping-button')?.addEventListener('click', () => notify('Ping test runs in the Android app, not this browser preview.'));
    }

    function profileCard(profile) {
      return `
        <article class="profile ${profile.selected ? 'selected' : ''}" data-select="${escapeHtml(profile.id)}">
          <div class="profile-info">
            <div class="profile-name">${escapeHtml(profile.name)}</div>
            <div class="profile-address">${escapeHtml(profile.server)}:${escapeHtml(profile.port)}</div>
          </div>
          <div class="profile-meta">
            <div>${selectedTransport(profile)}</div>
            <div class="profile-ping">Ping —</div>
          </div>
          <button class="profile-action" data-edit="${escapeHtml(profile.id)}" type="button" aria-label="Edit profile">✎</button>
          <button class="profile-action" data-share="${escapeHtml(profile.id)}" type="button" aria-label="Share profile">↗</button>
          <button class="profile-action" data-delete="${escapeHtml(profile.id)}" type="button" aria-label="Delete profile">▤</button>
        </article>
      `;
    }

    function renderConfigs() {
      const favorites = profiles.filter((profile) => profile.favorite);
      const saved = profiles.filter((profile) => !profile.favorite);

      appContent.innerHTML = `
        <section class="page configs-page">
          ${favorites.length ? `
            <div class="group">
              <span>⌄</span>
              <span class="group-label">Favorites</span>
              <span class="group-count">(${favorites.length})</span>
            </div>
            ${favorites.map(profileCard).join('')}
          ` : ''}

          ${profiles.length ? `
            <div class="group">
              <span>⌄</span>
              <span class="group-label">Saved</span>
              <span class="group-count">(${saved.length})</span>
            </div>
            ${saved.map(profileCard).join('')}
          ` : `
            <div class="empty">
              <div class="empty-icon">☁</div>
              <div class="empty-title">NO CONFIGURATIONS</div>
              <div class="empty-copy">Add a profile to connect to your Swock server.</div>
            </div>
          `}
        </section>
      `;

      addFab.hidden = false;

      document.querySelectorAll('[data-select]').forEach((card) => {
        card.addEventListener('click', (event) => {
          if (event.target.closest('button')) return;
          const id = card.dataset.select;
          profiles = profiles.map((profile) => ({ ...profile, selected: profile.id === id }));
          saveProfiles();
          render();
        });
      });

      document.querySelectorAll('[data-edit]').forEach((button) => {
        button.addEventListener('click', () => openEditor(button.dataset.edit));
      });

      document.querySelectorAll('[data-share]').forEach((button) => {
        button.addEventListener('click', () => shareProfile(button.dataset.share));
      });

      document.querySelectorAll('[data-delete]').forEach((button) => {
        button.addEventListener('click', () => deleteProfile(button.dataset.delete));
      });
    }

    function renderStats() {
      const profile = activeProfile();
      appContent.innerHTML = `
        <section class="page">
          <div class="group" style="margin-top: 0; margin-bottom: 12px;">
            <span>▣</span>
            <span class="group-label">STATS</span>
          </div>

          <article class="profile" style="padding: 14px 12px; min-height: 92px;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px;">
              <span style="color: var(--muted); font-size: 12px;">Ping <span style="color: var(--faint);">—</span></span>
              <button type="button" style="border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 4px; padding: 4px 10px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;">Ping</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; border-top: 1px solid var(--line); padding-top: 12px;">
              <div style="display:flex; flex-direction:column; align-items:flex-start; gap: 8px;">
                <div style="color: var(--muted); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.6px;">DOWNLINK</div>
                <div style="display:flex; align-items:center; gap: 6px; color: var(--faint); font-size: 18px;">⌄ <span style="font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);">—</span></div>
              </div>
              <div style="display:flex; flex-direction:column; align-items:flex-start; gap: 8px; border-left: 1px solid var(--line); padding-left: 14px;">
                <div style="color: var(--muted); font: 700 11px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1.6px;">UPLINK</div>
                <div style="display:flex; align-items:center; gap: 6px; color: var(--faint); font-size: 18px;">⌃ <span style="font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);">—</span></div>
              </div>
            </div>
          </article>

          <div class="profile" style="margin-top: 12px; padding: 14px 12px;">
            <div style="font-size: 12px; color: var(--muted); margin-bottom: 8px;">ACTIVE PROFILE</div>
            <div style="font-size: 15px; font-weight: 600;">${profile ? escapeHtml(profile.name) : 'No profile selected'}</div>
            <div style="margin-top: 5px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);">${profile ? `${escapeHtml(profile.server)}:${escapeHtml(profile.port)}` : 'Select a config to monitor traffic.'}</div>
          </div>
        </section>
      `;
    }

    function renderInfo() {
      appContent.innerHTML = `
        <section class="page">
          <div class="group" style="margin-top: 0; margin-bottom: 12px;">
            <span>ℹ</span>
            <span class="group-label">INFO</span>
          </div>

          <div class="profile" style="padding: 14px 12px;">
            <div style="display:grid; gap: 10px; font-size: 13px; color: var(--muted);">
              <div><span style="color: var(--ink); font-weight: 600; margin-right: 8px;">App</span>Swock VPN</div>
              <div><span style="color: var(--ink); font-weight: 600; margin-right: 8px;">Protocol</span>Swock custom tunnel</div>
              <div><span style="color: var(--ink); font-weight: 600; margin-right: 8px;">Transport</span>TCP / WebSocket / TLS</div>
              <div><span style="color: var(--ink); font-weight: 600; margin-right: 8px;">DNS</span>Primary, secondary, tertiary values if enabled</div>
              <div><span style="color: var(--ink); font-weight: 600; margin-right: 8px;">Status</span>${connected ? 'Connected' : 'Disconnected'}</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderLogs() {
      appContent.innerHTML = logEntries.length ? `
        <section class="page">
          <div class="group" style="margin-top: 0; margin-bottom: 12px;">
            <span>ⓘ</span>
            <span class="group-label">SESSION ACTIVITY</span>
            <span style="margin-left:auto; color: var(--cyan); cursor:pointer;" id="clear-logs">Clear</span>
          </div>
          ${logEntries.map((entry) => `
            <div class="profile" style="min-height: 58px; padding: 10px 12px;">
              <div style="width: 20px; color: var(--muted);">ⓘ</div>
              <div style="flex:1; min-width:0;">
                <div style="font-size: 13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(entry.message)}</div>
                <div style="font-size: 11px; color: var(--muted); margin-top: 4px;">${entry.time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
              </div>
            </div>
          `).join('')}
        </section>
      ` : `
        <section class="page">
          <div class="empty">
            <div class="empty-icon">▤</div>
            <div class="empty-title">[ NO LOGS ]</div>
            <div class="empty-copy">No logs available.<br><br>Connect or manage a profile to see activity here.</div>
          </div>
        </section>
      `;

      document.querySelector('#clear-logs')?.addEventListener('click', () => {
        logEntries = [];
        render();
      });
    }

    function render() {
      document.querySelectorAll('.tab').forEach((button) => {
        button.classList.toggle('active', Number(button.dataset.tab) === tab);
      });

      document.querySelector('#favorite-active').textContent = activeProfile()?.favorite ? '★' : '☆';
      addFab.hidden = tab !== 1;
      addSheet.hidden = true;

      if (tab === 0) renderHome();
      if (tab === 1) renderConfigs();
      if (tab === 2) renderStats();
      if (tab === 3) renderInfo();
      if (tab === 4) renderLogs();
    }

    function openEditor(id = null) {
      editingId = id;
      const profile = profiles.find((item) => item.id === id);

      document.querySelector('#form-title').textContent = profile ? 'Edit configuration' : 'Add configuration';
      document.querySelector('#profile-name').value = profile?.name || '';
      document.querySelector('#profile-server').value = profile?.server || '';
      document.querySelector('#profile-port').value = profile?.port || 443;
      document.querySelector('#profile-transport').value = profile?.transport || 'auto';
      document.querySelector('#websocket-enabled').checked = profile?.websocket || false;
      document.querySelector('#tls-enabled').checked = profile?.tls || false;
      document.querySelector('#websocket-host').value = profile?.websocketHost || '';
      document.querySelector('#websocket-path').value = profile?.websocketPath || '/';
      document.querySelector('#tls-sni').value = profile?.sni || '';
      document.querySelector('#profile-public').value = profile?.publicKey || '';
      document.querySelector('#profile-private').value = profile?.privateKey || '';
      document.querySelector('#profile-notes').value = profile?.notes || '';
      syncFieldVisibility();
      profileDialog.classList.add('open');
    }

    function closeEditor() {
      profileDialog.classList.remove('open');
      document.querySelector('#profile-form').reset();
      editingId = null;
    }

    function syncFieldVisibility() {
      const wsOn = document.querySelector('#websocket-enabled').checked;
      const tlsOn = document.querySelector('#tls-enabled').checked;
      document.querySelector('#websocket-host-wrap').hidden = !wsOn;
      document.querySelector('#websocket-path-wrap').hidden = !wsOn;
      document.querySelector('#tls-sni-wrap').hidden = !tlsOn;
    }

    function openImport() {
      document.querySelector('#profile-uri').value = '';
      importDialog.classList.add('open');
    }

    function shareProfile(id) {
      const profile = profiles.find((item) => item.id === id);
      if (!profile) return;
      const shareUrl = `swock://${profile.server}?port=${profile.port}&spk=${profile.publicKey}&cpk=${profile.privateKey}`;
      navigator.clipboard?.writeText(shareUrl).catch(() => {});
      notify(`Copied ${profile.name}`);
    }

    function deleteProfile(id) {
      const profile = profiles.find((item) => item.id === id);
      if (!profile) return;
      profiles = profiles.filter((item) => item.id !== id);
      if (!profiles.length) connected = false;
      else if (profile.selected) profiles[0].selected = true;
      saveProfiles();
      render();
      notify(`${profile.name} removed`);
    }

    document.querySelectorAll('.tab').forEach((button) => {
      button.addEventListener('click', () => {
        tab = Number(button.dataset.tab);
        render();
      });
    });

    document.querySelector('#favorite-active').addEventListener('click', () => {
      const profile = activeProfile();
      if (!profile) return;
      profiles = profiles.map((item) => ({ ...item, favorite: item.id === profile.id ? !item.favorite : item.favorite }));
      saveProfiles();
      render();
    });

    addFab.addEventListener('click', () => {
      addSheet.hidden = !addSheet.hidden;
    });

    document.querySelector('#manual-option').addEventListener('click', () => {
      addSheet.hidden = true;
      openEditor();
    });

    document.querySelector('#import-option').addEventListener('click', () => {
      addSheet.hidden = true;
      openImport();
    });

    document.querySelector('#cancel-profile').addEventListener('click', closeEditor);
    document.querySelector('#profile-form').addEventListener('submit', (event) => {
      event.preventDefault();

      const payload = {
        id: editingId || `profile-${Date.now()}`,
        name: document.querySelector('#profile-name').value.trim() || 'New profile',
        server: document.querySelector('#profile-server').value.trim(),
        port: Number(document.querySelector('#profile-port').value || 443),
        transport: document.querySelector('#profile-transport').value,
        websocket: document.querySelector('#websocket-enabled').checked,
        tls: document.querySelector('#tls-enabled').checked,
        websocketHost: document.querySelector('#websocket-host').value.trim(),
        websocketPath: document.querySelector('#websocket-path').value.trim() || '/',
        sni: document.querySelector('#tls-sni').value.trim(),
        publicKey: document.querySelector('#profile-public').value.trim(),
        privateKey: document.querySelector('#profile-private').value.trim(),
        notes: document.querySelector('#profile-notes').value.trim(),
        favorite: false,
        selected: true,
      };

      const existing = profiles.findIndex((item) => item.id === payload.id);
      if (existing >= 0) {
        profiles = profiles.map((item) => item.id === payload.id ? { ...item, ...payload } : item);
      } else {
        profiles = profiles.map((item) => ({ ...item, selected: false })).concat({ ...payload, selected: true });
      }

      saveProfiles();
      closeEditor();
      render();
      notify('Profile saved');
    });

    document.querySelector('#cancel-import').addEventListener('click', () => importDialog.classList.remove('open'));
    document.querySelector('#confirm-import').addEventListener('click', () => {
      const value = document.querySelector('#profile-uri').value.trim();
      if (!value) {
        notify('Paste a Swock profile link first.');
        return;
      }
      importDialog.classList.remove('open');
      notify('Profile imported');
    });

    document.querySelector('#websocket-enabled').addEventListener('change', syncFieldVisibility);
    document.querySelector('#tls-enabled').addEventListener('change', syncFieldVisibility);

    profileDialog.addEventListener('click', (event) => {
      if (event.target === profileDialog) closeEditor();
    });

    importDialog.addEventListener('click', (event) => {
      if (event.target === importDialog) importDialog.classList.remove('open');
    });

    logEntries.unshift({ message: 'Swock preview loaded.', time: new Date() });
    render();
  </script>
</body>
</html>
