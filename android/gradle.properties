# Tuned for a 4 GB development machine: one predictable worker, enough heap
# for release packaging, and no crash-dump files consuming disk after an OOM.
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=48m
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false
org.gradle.vfs.watch=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.daemon.jvmargs=-Xmx256m
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
